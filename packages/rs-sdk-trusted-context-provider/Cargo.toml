[package]
name = "rs-sdk-trusted-context-provider"
version.workspace = true
edition = "2021"
authors = ["sam@dash.org"]
license = "MIT"
description = "Trusted HTTP-based context provider for Dash Platform SDK"

[dependencies]
dash-core-proof = { path = "../rs-core-proof" }
dash-network-seeds = { workspace = true }
futures-util = "0.3"

dash-async = { path = "../rs-dash-async" }
dash-context-provider = { path = "../rs-context-provider" }
dpp = { path = "../rs-dpp", default-features = false, features = [
    "dash-sdk-features",
    "bls-signatures",
] }
# TLS backend target-gated (see [target] sections below): Android gets rustls
# + bundled webpki roots; all other targets keep default native-tls so iOS
# still validates against the system trust store.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.41"
lru = "0.16.3"
arc-swap = "1.7.1"
hex = "0.4.3"
url = "2.5"

[features]
default = []

# All system contracts (includes all individual contracts)
all-system-contracts = [
    "dpp/all-system_contracts",
    "withdrawals-contract",
    "dpns-contract",
    "dashpay-contract",
    "wallet-utils-contract",
    "token-history-contract",
    "keywords-contract",
    "document-history-contract",
]

# Individual contract features - these enable specific contracts in DPP
withdrawals-contract = ["dpp/withdrawals-contract"]
dpns-contract = ["dpp/dpns-contract"]
dashpay-contract = ["dpp/dashpay-contract"]
wallet-utils-contract = ["dpp/wallet-utils-contract"]
token-history-contract = ["dpp/token-history-contract"]
keywords-contract = ["dpp/keywords-contract"]
document-history-contract = ["dpp/document-history-contract"]

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls-webpki-roots"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", features = ["futures"] }
reqwest = { version = "0.12", features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Request", "RequestInit", "Response", "Headers"] }
wasm-streams = "0.5"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
