[package]
name = "dash-core-proof"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded Dash mining-transaction proof verification from a trusted snapshot"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# Match Dash Core/Platform's existing backend so SDKs do not ship two BLS engines.
blst = "=0.3.12"
dash-core-proof-x11 = { path = "../rs-core-proof-x11" }


[dev-dependencies]
serde_json = "1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
